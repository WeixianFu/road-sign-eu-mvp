# YOLOv8 Training Configuration (MacBook M3 Max - Debug/Overfit Test)
# Purpose: Aggressive settings for overfitting test to verify pipeline
# Usage: yolo train cfg=configs/train_debug.yaml data=configs/data.yaml

# =============================================================================
# Model & Input
# =============================================================================
model: yolov8s.pt  # Smaller model for faster iteration
imgsz: 1280        # MUST match tile size, do not change

# =============================================================================
# Training Control (Aggressive for M3 Max 48GB)
# =============================================================================
epochs: 50         # Enough for overfitting test
batch: 12          # M3 Max 48GB unified memory can handle this
device: mps        # Metal Performance Shaders
workers: 8         # 12 performance cores available
cache: True        # 48GB RAM, cache everything

# NO EARLY STOPPING - run all epochs for overfitting verification
# patience is not set, will run full epochs

# =============================================================================
# Optimizer
# =============================================================================
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# =============================================================================
# Augmentation - STRICT CONSTRAINTS (DO NOT MODIFY)
# =============================================================================
# Mosaic
mosaic: 1.0
close_mosaic: 5    # Shorter for debug runs

# Scale - CRITICAL: 0.1 means [0.9x, 1.1x], protects 20px tiny objects
scale: 0.1

# Geometric - ALL DISABLED for traffic signs
degrees: 0.0
shear: 0.0
perspective: 0.0
mixup: 0.0

# Flip
flipud: 0.0        # No vertical flip (signs have orientation)
fliplr: 0.5        # Horizontal flip OK

# Color (default values, safe for multi-scale objects)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# =============================================================================
# Output
# =============================================================================
project: runs/mtsd
name: yolov8s_debug

