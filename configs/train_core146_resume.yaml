# YOLOv8 续训配置 (mtsd_core146 · 第一次训练 E35+ 出现 nan 发散后的重启)
# 用法: ./scripts/train.sh configs/train_core146_resume.yaml configs/data_core146.yaml
#
# 背景: 第一次训练峰值在 E22 (mAP50-95=0.623)，之后过拟合下坡，E35 起 AMP/魔改卡
#       触发 nan 数值发散。best.pt(E22) 完好。本配置修 nan 根因并缩短调度重训。

# =============================================================================
# Model & Input
# =============================================================================
# 从哪继续 —— 二选一：
#   (A) 暖启动(默认, 省钱): 从第一次训练的干净 checkpoint 接着练。把下面路径换成
#       服务器上 ls weights/ 里实际存在、且在 nan(E35) 之前的那个, E20 附近最佳。
#       这不是 ultralytics 的 resume(那需要 last.pt, 已被 nan 污染), 而是用干净权重
#       初始化一次全新的短调度训练 —— 会重新 warmup, lr 从头走 60-epoch cosine。
model: runs/detect/runs/mtsd_core146/yolov8m_core146/weights/epoch20.pt
#   (B) 干净重训: 若想完全从 COCO 预训练重来(更慢但最干净), 改成:
# model: yolov8m.pt
imgsz: 1280  # MUST match tile size, do not change

# =============================================================================
# Training Control
# =============================================================================
epochs: 60       # 第一次证明 ~E22 就到顶, 150 是浪费; 60 + patience 足够
batch: 48        # 2x4090-48G: 48。关 amp 后显存升高, 若 OOM 降到 40/32
device: [0, 1]
workers: 10
patience: 15     # 峰值早, 15 轮无提升即停 (原 50 会让它跑到发散)
save_period: 5
cache: False

# =============================================================================
# Optimizer
# =============================================================================
optimizer: AdamW
lr0: 0.001       # 收敛正常, 不动。若暖启动后仍很快过拟合可试 0.0005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# =============================================================================
# 数值稳定性 —— 本次新增, 治 nan 的核心
# =============================================================================
amp: False       # 关混合精度: nan 时好时坏是 fp16 溢出 + 魔改卡驱动抖动的特征。
                 # 代价是显存/速度上升, 48G 卡可接受。这是相对第一次唯一的实质改动。

# =============================================================================
# Augmentation - STRICT CONSTRAINTS (DO NOT MODIFY, 与第一次保持一致)
# =============================================================================
mosaic: 1.0
close_mosaic: 10
scale: 0.1          # [0.9x,1.1x], 保护 20px 小目标
degrees: 0.0
shear: 0.0
perspective: 0.0
mixup: 0.0
flipud: 0.0
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# =============================================================================
# Output
# =============================================================================
project: runs/mtsd_core146
name: yolov8m_core146_r2   # 换名, 不覆盖第一次 (E22) 的产物
