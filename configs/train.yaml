# YOLOv8 Training Configuration
# Purpose: Defines hyperparameters and training settings for YOLOv8 model training
# This configuration is used by the training script to set up model training

# Model architecture (yolov8n, yolov8s, yolov8m, yolov8l, yolov8x)
model: yolov8m.pt

# Image size for training (will be resized to this size)
imgsz: 1280

# Batch size (adjust based on GPU memory: 16GB GPU can handle batch=12-16 for yolov8m)
batch: 12

# Number of training epochs
epochs: 100

# Device (0 for GPU 0, cpu for CPU, or list of GPUs)
device: 0

# Number of workers for data loading
workers: 4

# Augmentation hyperparameters per core constraints
mosaic: 1.0       # keep enabled early to mix context
scale: 0.2        # restrict scaling (0.8~1.2) to protect tiny 22px signs
degrees: 0.0      # no rotation to avoid shape distortion
close_mosaic: 10  # disable mosaic in last epochs for natural distribution

# Project directory for saving results
project: runs/mtsd

# Experiment name
name: yolov8m_mtsd

# Additional training parameters can be added here
