model: yolov8m.pt
imgsz: 1280
epochs: 100
patience: 20
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_bias_lr: 0.0
cos_lr: true
seed: 42
deterministic: true
amp: false
cache: false
save_period: 5
mosaic: 1.0
close_mosaic: 10
scale: 0.1
degrees: 0.0
translate: 0.0
shear: 0.0
perspective: 0.0
fliplr: 0.0
flipud: 0.0
mixup: 0.0
copy_paste: 0.0
cutmix: 0.0
multi_scale: false
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
profiles:
  desktop:
    device: 0
    batch: 2
    workers: 4
  server:
    device: 0
    batch: 8
    workers: 8
