# YOLOv8 Training Configuration (mtsd_core146 · CUDA Server - Production)
# Purpose: Full training on AutoDL server, 146-class core set (no others)
# Usage: ./scripts/train.sh  (defaults to this config + data_core146.yaml)

# =============================================================================
# Model & Input
# =============================================================================
model: yolov8m.pt
imgsz: 1280  # MUST match tile size, do not change

# =============================================================================
# Training Control
# =============================================================================
epochs: 150
batch: 48        # 总 batch。2x4090-48G: 48 (24/卡, ~40G/卡) | 单卡4090-48G: 24 | PRO 6000 96G: 48
device: [0, 1]   # 2x 魔改4090-48G DDP；单卡改 0。注意 DDP 丢自定义 callback（full-val 已禁用，无影响）
workers: 10
patience: 50     # Early stopping patience
save_period: 5   # 每5个epoch保存一次checkpoint
cache: False     # 不缓存 (131k tiles 解码后 >600GB，RAM/disk 都不现实)

# =============================================================================
# Optimizer
# =============================================================================
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# =============================================================================
# Augmentation - STRICT CONSTRAINTS (DO NOT MODIFY)
# =============================================================================
# Mosaic
mosaic: 1.0
close_mosaic: 10

# Scale - CRITICAL: 0.1 means [0.9x, 1.1x], protects 20px tiny objects
scale: 0.1

# Geometric - ALL DISABLED for traffic signs
degrees: 0.0
shear: 0.0
perspective: 0.0
mixup: 0.0

# Flip
flipud: 0.0      # No vertical flip (signs have orientation)
fliplr: 0.5      # Horizontal flip OK

# Color (default values, safe for multi-scale objects)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# =============================================================================
# Output
# =============================================================================
project: runs/mtsd_core146
name: yolov8m_core146
