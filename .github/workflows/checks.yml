name: Image pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lightweight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev,evaluate]' -c requirements/constraints.txt
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q
  ultralytics-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,dev,evaluate]' -c requirements/constraints.txt
      - run: python -m pytest -q -m integration
        env:
          YOLO_CONFIG_DIR: /tmp/roadsigns-ultralytics
